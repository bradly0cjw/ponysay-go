name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v0.0.1)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        run: |
          mkdir -p build
          
          # Extract version from input tag_name or git ref_name (e.g. v1.0.0)
          VERSION="${{ inputs.tag_name }}"
          if [ -z "$VERSION" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          echo "Building binaries for version: $VERSION"
          
          # macOS amd64 & arm64
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-darwin-amd64 ./cmd/ponysay
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-darwin-arm64 ./cmd/ponysay
          
          # Linux amd64 & arm64
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-linux-amd64 ./cmd/ponysay
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-linux-arm64 ./cmd/ponysay
          
          # Windows amd64 & arm64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-windows-amd64.exe ./cmd/ponysay
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w -X main.commitHash=$VERSION" -o build/ponysay-windows-arm64.exe ./cmd/ponysay

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            build/ponysay-darwin-amd64
            build/ponysay-darwin-arm64
            build/ponysay-linux-amd64
            build/ponysay-linux-arm64
            build/ponysay-windows-amd64.exe
            build/ponysay-windows-arm64.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

